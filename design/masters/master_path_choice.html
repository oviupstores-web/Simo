<style>body{min-height:100dvh}::-webkit-scrollbar{display:none}</style></head><body class="bg-bg text-ink font-sans antialiased"><header class="px-5 pt-4 flex items-center justify-between"><button aria-label="Retour" class="w-9 h-9 -ml-1 flex items-center justify-center text-ink"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button><div class="flex items-center gap-2"><img src="assets/logo_96.png" alt="Menoo" class="w-10 h-10 rounded-[11px]"><span class="text-[22px] font-extrabold tracking-tight text-primary-dark">Menoo</span></div><span class="w-9"></span></header>
<main class="px-5 pb-8"><h1 class="mt-6 text-[28px] leading-[34px] font-extrabold tracking-tight text-center">Quel est votre mode ?</h1>

<div class="mt-6 flex flex-col gap-3"><button data-target="Cover_Individual" class="w-full text-left rounded-card overflow-hidden flex bg-white border-2 border-primary bg-mint/40 shadow-card"><img src="assets/mode_solo.jpg" alt="" class="w-[38%] object-cover"><div class="flex-1 p-3.5"><div class="flex items-start justify-between"><span class="text-[18px] font-extrabold">Pour moi</span><span class="w-7 h-7 rounded-full bg-primary text-white flex items-center justify-center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg></span></div><p class="text-[12.5px] leading-[17px] text-ink2 mt-1">Des menus adaptés à mes objectifs personnels.</p><ul class="mt-2.5 flex flex-col gap-1.5"><li class="flex items-center gap-2 text-[13px] text-ink2"><span class="w-[17px] h-[17px] rounded-full bg-leaf text-white flex items-center justify-center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg></span>Perte de poids</li><li class="flex items-center gap-2 text-[13px] text-ink2"><span class="w-[17px] h-[17px] rounded-full bg-leaf text-white flex items-center justify-center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg></span>Prise de masse</li><li class="flex items-center gap-2 text-[13px] text-ink2"><span class="w-[17px] h-[17px] rounded-full bg-leaf text-white flex items-center justify-center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg></span>Maintien</li><li class="flex items-center gap-2 text-[13px] text-ink2"><span class="w-[17px] h-[17px] rounded-full bg-leaf text-white flex items-center justify-center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg></span>Mode de vie sain</li></ul></div></button><button data-target="Cover_Household" class="w-full text-left rounded-card overflow-hidden flex bg-white border border-line shadow-card"><img src="assets/mode_famille.jpg" alt="" class="w-[38%] object-cover"><div class="flex-1 p-3.5"><div class="flex items-start justify-between"><span class="text-[18px] font-extrabold">Pour la famille</span><span class="w-7 h-7 rounded-full border-2 border-line bg-white"></span></div><p class="text-[12.5px] leading-[17px] text-ink2 mt-1">Des menus adaptés à tous les membres du foyer.</p><ul class="mt-2.5 flex flex-col gap-1.5"><li class="flex items-center gap-2 text-[13px] text-ink2"><span class="w-[17px] h-[17px] rounded-full bg-leaf text-white flex items-center justify-center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg></span>Adultes, enfants, bébés</li><li class="flex items-center gap-2 text-[13px] text-ink2"><span class="w-[17px] h-[17px] rounded-full bg-leaf text-white flex items-center justify-center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg></span>Goûts et régimes différents</li><li class="flex items-center gap-2 text-[13px] text-ink2"><span class="w-[17px] h-[17px] rounded-full bg-leaf text-white flex items-center justify-center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg></span>Budget global</li><li class="flex items-center gap-2 text-[13px] text-ink2"><span class="w-[17px] h-[17px] rounded-full bg-leaf text-white flex items-center justify-center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg></span>Organisation simplifiée</li></ul></div></button></div>
<div class="mt-4 rounded-card bg-mint p-4 flex gap-3 items-start"><span class="text-primary"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg></span><div><div class="text-[14px] font-bold">Un seul compte, deux modes</div><p class="text-[12.5px] leading-[18px] text-ink2 mt-0.5">Vous pourrez passer du mode Solo au mode Foyer à tout moment dans les réglages.</p></div></div>
