<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>

<!-- Social Auth Section -->
<div class="flex flex-col items-center w-full mb-6">
<div class="flex items-center gap-3 w-full mb-4 px-2">
<div class="flex-1 h-[1px] bg-surface-container-high"></div>
<span class="font-label-sm text-label-sm text-outline uppercase tracking-wider">ou continuer avec</span>
<div class="flex-1 h-[1px] bg-surface-container-high"></div>
</div>
<div class="grid grid-cols-2 gap-3 w-full">
<!-- Google Auth Button -->
<button class="h-12 bg-surface-container-lowest rounded-full flex items-center justify-center gap-2.5 px-4 shadow-sm active:scale-95 transition-transform duration-150" type="button">
<svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
<span class="font-label-md text-label-md text-on-surface font-semibold">Google</span>
</button>
<!-- Apple Auth Button -->

<svg class="w-4 h-4 flex-shrink-0 fill-on-surface" viewBox="0 0 24 24">
<path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.61-.74 1.02-1.77.9-2.8-.88.04-1.95.59-2.58 1.33-.56.64-.99 1.69-.86 2.68 1 .08 1.93-.47 2.54-1.21z"></path>
</svg>
<span class="font-label-md text-label-md text-on-surface font-semibold">Apple</span>
</button>

<!-- Sign In Redirection Link -->
<div class="flex items-center justify-center gap-1.5 text-center pb-3">
<span class="font-body-md text-body-md text-on-surface-variant">Déjà inscrit ?</span>
<a class="font-label-lg text-label-lg text-primary font-bold active:opacity-80" href="#">Se connecter</a>
</div>
</div>
<script>
  (function() {
    const pwdInput = document.getElementById('password');
    const toggleBtn = document.getElementById('toggle-pwd');
    const toggleIcon = document.getElementById('toggle-icon');
    const termsContainer = document.getElementById('terms-container');
    const termsBtn = document.getElementById('terms-toggle');
    const termsIcon = document.getElementById('terms-icon');

    if (toggleBtn && pwdInput) {
      toggleBtn.addEventListener('click', function(e) {
        e.preventDefault();
        const isPassword = pwdInput.type === 'password';
        pwdInput.type = isPassword ? 'text' : 'password';
        toggleIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    if (termsContainer && termsBtn) {
      termsContainer.addEventListener('click', function(e) {
        if (e.target.tagName.toLowerCase() === 'a') return;
        const isChecked = termsBtn.getAttribute('aria-checked') === 'true';
        if (isChecked) {
          termsBtn.setAttribute('aria-checked', 'false');
          termsBtn.className = 'w-5 h-5 mt-0.5 rounded-full bg-surface-container-high flex items-center justify-center flex-shrink-0 transition-transform active:scale-90';
          termsIcon.classList.add('hidden');
        } else {
          termsBtn.setAttribute('aria-checked', 'true');
          termsBtn.className = 'w-5 h-5 mt-0.5 rounded-full bg-secondary flex items-center justify-center flex-shrink-0 transition-transform active:scale-90';
          termsIcon.classList.remove('hidden');
        }
      });
    }
  })();
</script></main>
